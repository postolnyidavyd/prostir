server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # хешовані ассети Vite можна кешувати надовго
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: будь-який маршрут віддає index.html, роутинг робить клієнт
  location / {
    try_files $uri $uri/ /index.html;
  }
}
